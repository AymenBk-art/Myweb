<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script> 
    
</head>
<body class="bg-light">
    
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto text-primary">إشعار النظام</strong>
                <small id="toastTime">الآن</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastBody">
                </div>
        </div>
    </div>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
                <span style="font-family: monospace; font-size: 1.5rem; color: #4CAF50;">{ }</span> 
                <span class="ms-2">CodeLabX Dashboard</span>
            </a>
            <button id="logoutButtonNav" class="btn btn-outline-danger">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </nav>

    
    <div class="container mt-5">
        <div class="row">
            
            <div class="col-md-5"> 
                <div class="card shadow p-3 mb-4">
                    <h5 class="text-primary border-bottom pb-2 mb-3">
                        <i class="fas fa-users me-2"></i> الدردشة الخاصة
                    </h5>
                    <ul id="userList" class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;">
                        <li class="list-group-item text-muted">جاري تحميل المستخدمين...</li>
                    </ul>
                </div>
                
                <div class="card shadow p-4 mb-4">
                    <h1 id="welcomeMessage" class="card-title text-success mb-3">جاري التحميل...</h1>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="badge bg-primary fs-6 p-2">
                            مكتملة: <span id="completedCount">0</span>
                        </span>
                        <span class="badge bg-secondary fs-6 p-2">
                            متبقية: <span id="remainingCount">0</span>
                        </span>
                    </div>
                    <p class="card-text lead">هذه هي صفحتك الرئيسية الآمنة.</p>
                    <a href="https://wa.me/212665335463?text=مرحبا،%20لدي%20استفسار..." target="_blank" class="btn btn-info mt-3 w-75 mx-auto">تواصل معي عبر WhatsApp</a>
                </div>
            </div> 
            
            <div class="col-md-7">
                
                <div class="card shadow p-3 d-none mb-4" id="chatWindow">
                    <h5 id="chatHeader" class="border-bottom pb-2 mb-3 text-info">
                        محادثة مع: <span>...</span>
                    </h5>
                    <div id="messages" class="mb-3 p-3 border rounded" style="height: 300px; overflow-y: auto;">
                        </div>
                    <form id="messageForm" class="d-flex">
                        <input type="text" id="messageInput" class="form-control me-2" placeholder="اكتب رسالتك..." required>
                        <button type="submit" class="btn btn-info">إرسال</button>
                    </form>
                </div>

                <div class="mt-4 p-4 bg-white rounded shadow-lg">
                    <h4 class="text-primary mb-3">أضف مهمة جديدة</h4>
                    <form id="taskForm" class="d-flex">
                        <input type="text" id="taskDescription" class="form-control me-2" 
                               placeholder="ما هي مهمتك الجديدة؟" required>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus"></i> إضافة
                        </button>
                    </form>
                </div>

                <div class="mt-4">
                    <h4 class="text-secondary">مهامي</h4>
                    <ul id="taskList" class="list-group">
                        <li class="list-group-item text-muted">جاري تحميل المهام...</li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'https://codelabx.onrender.com';
        
        let socket;
        let currentChatUserId = null;
        let currentChatUsername = null; 
        
        // ===========================================
        // الدوال المساعدة (الإشعارات، الـ CRUD)
        // ===========================================
        function showToast(message, isSuccess = true) {
            const toastElement = document.getElementById('liveToast');
            const toastBody = document.getElementById('toastBody');
            const toastHeader = toastElement.querySelector('.toast-header');
            
            toastBody.textContent = message;
            
            if (isSuccess) {
                toastHeader.classList.remove('bg-danger');
                toastHeader.classList.add('bg-success');
                toastHeader.style.color = 'white';
            } else {
                toastHeader.classList.remove('bg-success');
                toastHeader.classList.add('bg-danger');
                toastHeader.style.color = 'white';
            }

            const toast = new bootstrap.Toast(toastElement);
            toast.show();
        }
        function toggleComplete(event) {
            const taskId = event.currentTarget.closest('li').dataset.id;
            const completed = event.currentTarget.checked;
            
            fetch(`${API_URL}/api/tasks/${taskId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: completed })
            })
            .then(response => {
                if (!response.ok) throw new Error('فشل تحديث حالة المهمة.');
                return response.json();
            })
            .then(() => {
                fetchTasks(); 
                showToast(completed ? 'أحسنت! تم إكمال المهمة.' : 'تم إلغاء إكمال المهمة.');
            })
            .catch(error => { showToast(error.message, false); });
        }
        function deleteTask(event) {
            const taskId = event.currentTarget.closest('li').dataset.id;

            if (!confirm("هل أنت متأكد من حذف هذه المهمة؟")) return;

            fetch(`${API_URL}/api/tasks/${taskId}`, { method: 'DELETE' })
            .then(response => {
                if (!response.ok) throw new Error('فشل حذف المهمة.');
                return response.json();
            })
            .then(() => {
                fetchTasks(); 
                showToast('تم حذف المهمة بنجاح.');
            })
            .catch(error => { showToast(error.message, false); });
        }
        function toggleLike(event) {
            const taskId = event.target.closest('button').dataset.taskId;
            
            fetch(`${API_URL}/api/tasks/${taskId}/like`, { method: 'PUT' })
            .then(response => response.json())
            .then(data => {
                if (data.message.includes('نجاح')) {
                    showToast(data.message, true);
                    fetchTasks(); 
                } else { showToast(data.message, false); }
            })
            .catch(error => showToast("فشل الاتصال لتسجيل الإعجاب.", false));
        }
        
        function fetchTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '<li class="list-group-item text-info"><i class="fas fa-spinner fa-spin me-2"></i>جاري تحميل المهام...</li>';

            fetch(`${API_URL}/api/tasks`, { method: 'GET' })
            .then(response => {
                if (!response.ok) throw new Error('فشل جلب المهام.');
                return response.json();
            })
            .then(data => {
                taskList.innerHTML = '';
                let completedCount = 0;
                let totalCount = data.tasks.length;
                
                if (totalCount === 0) {
                    taskList.innerHTML = '<li class="list-group-item text-muted">لا توجد مهام حالياً.</li>';
                }

                const currentUserId = document.getElementById('welcomeMessage').dataset.userId;

                data.tasks.forEach(task => {
                    if (task.completed) completedCount++;

                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.dataset.id = task._id;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'd-flex align-items-center flex-grow-1';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'form-check-input me-3';
                    checkbox.checked = task.completed;
                    checkbox.addEventListener('change', toggleComplete);

                    const descriptionSpan = document.createElement('span');
                    descriptionSpan.textContent = task.description;
                    if (task.completed) { descriptionSpan.classList.add('task-completed'); }

                    contentDiv.appendChild(checkbox);
                    contentDiv.appendChild(descriptionSpan);

                    const controlsDiv = document.createElement('div');
                    
                    // زر الإعجاب
                    const isLiked = task.likes.includes(currentUserId);
                    const likeButton = document.createElement('button');
                    likeButton.className = `btn btn-sm me-2 ${isLiked ? 'text-danger' : 'text-secondary'}`;
                    likeButton.style.border = 'none';
                    likeButton.innerHTML = `
                        <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> 
                        <span class="likes-count">${task.likes.length}</span>
                    `;
                    likeButton.addEventListener('click', toggleLike);

                    // زر الحذف
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn btn-sm btn-outline-danger';
                    deleteButton.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    deleteButton.addEventListener('click', deleteTask);

                    controlsDiv.appendChild(likeButton);
                    controlsDiv.appendChild(deleteButton);

                    li.appendChild(contentDiv);
                    li.appendChild(controlsDiv);
                    taskList.appendChild(li);
                });

                // تحديث العدادات
                document.getElementById('completedCount').textContent = completedCount;
                document.getElementById('remainingCount').textContent = totalCount - completedCount;
            })
            .catch(error => {
                taskList.innerHTML = `<li class="list-group-item text-danger">خطأ في جلب المهام: ${error.message}</li>`;
            });
        }
        
        // دوال الدردشة
        function displayMessage(content, isSender) {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = `d-flex w-100 ${isSender ? 'justify-content-end' : 'justify-content-start'}`; 
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `alert alert-sm ${isSender ? 'alert-primary' : 'alert-secondary'} border-0`;
            contentDiv.style.maxWidth = '70%';
            contentDiv.textContent = content;

            messageElement.appendChild(contentDiv);
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        }
        
        function startChat(userId, username) {
            currentChatUserId = userId;
            currentChatUsername = username;
            document.getElementById('chatHeader').querySelector('span').textContent = username;
            document.getElementById('chatWindow').classList.remove('d-none');
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div class="text-center text-muted"><i class="fas fa-spinner fa-spin"></i> جاري تحميل السجل...</div>';
            
            // جلب سجل الرسائل القديمة (المسار الجديد)
            fetch(`${API_URL}/api/messages/${userId}`, { method: 'GET' })
            .then(response => response.json())
            .then(data => {
                messagesDiv.innerHTML = '';
                const myUserId = document.getElementById('welcomeMessage').dataset.userId; 
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const isSender = msg.sender === myUserId;
                        displayMessage(msg.content, isSender);
                    });
                } else {
                    messagesDiv.innerHTML = '<div class="text-center text-muted">ابدأ المحادثة...</div>';
                }
            })
            .catch(error => {
                messagesDiv.innerHTML = `<div class="text-center text-danger">خطأ في تحميل السجل.</div>`;
                console.error("Error loading chat history:", error);
            });
        }
        
        function handleIncomingMessage(message) {
            if (message.senderId === currentChatUserId) {
                displayMessage(message.content, false); 
            } else {
                showToast(`رسالة جديدة من مستخدم آخر!`, false); 
            }
        }
        
        function fetchUsers() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '<li class="list-group-item text-info"><i class="fas fa-spinner fa-spin me-2"></i>جاري تحميل المستخدمين...</li>';

            fetch(`${API_URL}/api/users`, { method: 'GET' })
            .then(response => {
                if (!response.ok) { throw new Error('فشل جلب المستخدمين، الجلسة منتهية.'); }
                return response.json();
            })
            .then(data => {
                userList.innerHTML = ''; 
                if (data.users.length === 0) {
                    userList.innerHTML = '<li class="list-group-item text-muted">لا يوجد مستخدمون آخرون حالياً.</li>';
                    return;
                }

                data.users.forEach(user => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center user-item';
                    li.textContent = user.username;
                    li.dataset.userId = user._id;

                    li.addEventListener('click', () => startChat(user._id, user.username));
                    userList.appendChild(li);
                });
            })
            .catch(error => {
                userList.innerHTML = `<li class="list-group-item text-danger">خطأ: ${error.message}</li>`;
            });
        }
        

        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. كود التحقق من التوكن وجلب اسم المستخدم
            fetch(`${API_URL}/api/profile`, { method: 'GET', })
            .then(response => {
                if (!response.ok) { throw new Error('التذكرة غير صالحة.'); }
                return response.json();
            })
            .then(user => {
                const welcomeMessage = document.getElementById('welcomeMessage');
                welcomeMessage.textContent = `مرحباً بعودتك، ${user.username}!`;
                document.getElementById('welcomeMessage').dataset.userId = user.userId; 
                
                fetchTasks(); 
                
                // تهيئة Socket.IO
                socket = io(API_URL, { withCredentials: true });
                socket.on('connect', () => {
                    console.log("Socket.IO متصل بنجاح!");
                    fetchUsers(); 
                });
                socket.on('receiveMessage', handleIncomingMessage);
            })
            .catch(error => {
                showToast('فشل التحقق من الجلسة، يرجى تسجيل الدخول مجدداً.', false);
                window.location.href = 'index.html'; // التوجيه للصفحة الرئيسية
            });
            
            
            // 2. كود إضافة مهمة جديدة (POST /api/tasks)
            const taskForm = document.getElementById('taskForm');
            taskForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const description = document.getElementById('taskDescription').value.trim();

                fetch(`${API_URL}/api/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', },
                    body: JSON.stringify({ description: description })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message.includes('بنجاح')) {
                        showToast("تم إضافة المهمة: " + data.task.description, true);
                        document.getElementById('taskDescription').value = ''; 
                        fetchTasks(); 
                    } else { showToast("فشل الإضافة: " + data.message, false); }
                })
                .catch(error => { showToast('فشل إضافة المهمة: ' + error.message, false); });
            });


            // 3. كود تسجيل الخروج (لمسح الكوكي عبر السيرفر)
            const logoutButtons = document.querySelectorAll('#logoutButtonNav'); 
            logoutButtons.forEach(button => {
                button.addEventListener('click', () => {
                    fetch(`${API_URL}/logout`, { method: 'POST' })
                    .then(() => {
                        window.location.href = 'index.html';
                    })
                    .catch(error => { showToast('فشل تسجيل الخروج، يرجى المحاولة لاحقاً.', false); });
                });
            });


            // 4. ربط نموذج إرسال الرسائل
            const messageForm = document.getElementById('messageForm');
            if (messageForm) {
                messageForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    
                    const messageInput = document.getElementById('messageInput');
                    const content = messageInput.value.trim();
                    
                    if (!content || !currentChatUserId) {
                        showToast('الرجاء اختيار مستخدم وكتابة رسالة.', false);
                        return;
                    }

                    socket.emit('sendMessage', {
                        receiverId: currentChatUserId,
                        content: content
                    });

                    displayMessage(content, true); 
                    messageInput.value = '';
                });
            }
        });
    </script>

</body>
</html>
