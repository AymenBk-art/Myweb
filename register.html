<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
            <form id="register-form">
                <h2 class="card-title text-center text-success mb-4">
                    إنشاء حساب جديد
                </h2>
                
                <div class="mb-3">
                    <label for="username" class="form-label">اسم المستخدم</label>
                    <input type="text" id="username" name="username" class="form-control" required> 
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <div class="mb-4">
                    <label for="confirm-password" class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 mb-3">
                    تسجيل
                </button>
                
                <p class="text-center text-muted">
                    لديك حساب بالفعل؟ <a href="login.html" class="text-decoration-none">سجل الدخول من هنا</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'myweb-production-e788.up.railway.app';

        const registerForm = document.getElementById('register-form');

        registerForm.addEventListener('submit', (event) => {
            event.preventDefault(); 

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('كلمتا المرور غير متطابقتين. يرجى التحقق مرة أخرى.');
                return; 
            }

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password
            };

            // 💥 الإضافة والتعديل الأهم في طلب fetch
            fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
                // 🔑 هذا ضروري لضمان عدم حظر الطلب من المتصفح (CORS)
                credentials: 'include' 
            })
            .then(response => {
                // يجب فحص حالة الاستجابة (Status: 200/400/500) قبل محاولة قراءة JSON
                if (!response.ok) {
                    // إذا كان هناك خطأ (400 أو 500)، اقرأ رسالة الخطأ وأرسلها كـ Exception
                    return response.json().then(err => {
                        throw new Error(err.message || 'فشل التسجيل بسبب خطأ غير معروف في السيرفر.');
                    });
                }
                // إذا كانت الاستجابة ناجحة (200)، استمر في قراءة JSON
                return response.json();
            })
            .then(data => {
                alert(data.message);
                // التوجيه إلى صفحة تسجيل الدخول بعد النجاح
                window.location.href = 'login.html'; 
            })
            .catch(error => {
                console.error('Registration Error:', error);
                // عرض رسالة الخطأ التي تم التقاطها من السيرفر أو الشبكة
                alert(error.message);
            });
        });
    </script>

</body>
</html>
