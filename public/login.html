<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
            <form id="login-form">
                <h2 class="card-title text-center text-primary mb-4">
                    تسجيل الدخول
                </h2>
                
                <div class="mb-3">
                    <label for="username" class="form-label">اسم المستخدم</label>
                    <input type="text" id="username" name="username" class="form-control" required> 
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    دخول
                </button>
                
                <p class="text-center text-muted">
                    ليس لديك حساب؟ <a href="register.html" class="text-decoration-none">أنشئ حساباً الآن</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = window.location.origin;
        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
                credentials: 'include'
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => {
                        throw new Error(err.message || 'فشل تسجيل الدخول بسبب خطأ غير معروف في السيرفر.');
                    });
                }
                return response.json();
            })
            .then(data => {
                alert(data.message);
                window.location.href = 'dashboard.html';
            })
            .catch(error => {
                console.error('Login Error:', error);
                alert(error.message);
            });
        });
    </script>

</body>
</html>
